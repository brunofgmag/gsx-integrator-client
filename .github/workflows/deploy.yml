name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: Version expected in VERSION.txt (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      release_exists: ${{ steps.duplicate-check.outputs.exists }}
      build_ref: ${{ steps.buildref.outputs.ref }}
    steps:
      - name: Verify branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::deploy must run on main. Got: $REF"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate VERSION.txt
        id: read
        env:
          REQ_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION.txt)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::VERSION.txt must be MAJOR.MINOR.PATCH (got '$version')"; exit 1; }
          if [ -n "$REQ_VERSION" ] && [ "$REQ_VERSION" != "$version" ]; then
            echo "::error::Requested $REQ_VERSION does not match VERSION.txt ($version)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check duplicate
        id: duplicate-check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.read.outputs.tag }}
          VER: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "gsx-integrator-client-$VER.zip"
            "gsx-integrator-client-$VER.zip.sha256"
            "gsx-integrator-flightsim-to-$VER.zip"
            "gsx-integrator-flightsim-to-$VER.zip.sha256"
          )
          if names="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            missing=0
            for asset in "${expected[@]}"; do
              grep -qxF "$asset" <<<"$names" || missing=1
            done
            if [ "$missing" -eq 0 ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Release $TAG already published with every asset; nothing to do."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Release $TAG exists but is missing assets; rebuilding and re-uploading."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve commit
        id: buildref
        env:
          TAG: ${{ steps.read.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::Tag $TAG already exists; building from the tagged commit."
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build + Package
    needs: version
    if: needs.version.outputs.release_exists == 'false'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.build_ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: brunofgmag/gsx-integrator-ci/.github/actions/setup-build-env@main
        with:
          qt-modules: qtwebsockets
          sdk-url: ${{ secrets.MSFS_SDK_URL }}
          sdk-sha256: ${{ secrets.MSFS_SDK_SHA256 }}
          sdk-required-paths: |
            SimConnect SDK/include/SimConnect.h
            SimConnect SDK/lib/SimConnect.lib
            SimConnect SDK/lib/SimConnect.dll

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Config Release -SkipTests

      - name: Build flightsim.to flavor
        shell: pwsh
        run: ./build.ps1 -Config Release -SkipTests -FlightsimTo

      - name: Stage bundle
        shell: pwsh
        run: |
          $stage = 'staging/gsx-integrator-client'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path 'build/release/bin/*' -Destination $stage -Recurse -Force

      - name: Package + Hash
        shell: pwsh
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          $zip = "gsx-integrator-client-$env:VER.zip"
          Compress-Archive -Path 'staging/gsx-integrator-client' -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline

      - name: Fetch CommBus
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = 'commbus-release'
          gh release download --repo brunofgmag/gsx-integrator-commbus --pattern 'gsx-integrator-commbus-*.zip*' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the latest CommBus release.' }
          $zip = Get-ChildItem -LiteralPath $dir -Filter 'gsx-integrator-commbus-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'The latest CommBus release has no zip asset.' }
          $expected = ((Get-Content -Raw -LiteralPath "$($zip.FullName).sha256") -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLower()
          if ($expected -ne $actual) { throw "CommBus checksum mismatch: expected $expected, got $actual." }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath 'commbus-package' -Force
          if (-not (Test-Path -LiteralPath 'commbus-package/gsx-integrator-commbus/manifest.json')) { throw 'CommBus zip has no gsx-integrator-commbus/manifest.json.' }
          Write-Host "Bundling $($zip.Name)"

      - name: Stage flightsim.to bundle
        shell: pwsh
        env:
          FLIGHTSIM_TO_URL: ${{ vars.FLIGHTSIM_TO_URL }}
        run: |
          $stage = 'staging-flightsim-to/gsx-integrator-client'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path 'build/release-flightsim-to/bin/*' -Destination $stage -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$stage/commbus" | Out-Null
          Copy-Item -Path 'commbus-package/gsx-integrator-commbus' -Destination "$stage/commbus" -Recurse -Force
          $pageUrl = if ($env:FLIGHTSIM_TO_URL) { $env:FLIGHTSIM_TO_URL } else { 'https://flightsim.to/' }
          [ordered]@{ channel = 'flightsim.to'; pageUrl = $pageUrl } | ConvertTo-Json | Out-File -FilePath "$stage/distribution.json" -Encoding utf8NoBOM

      - name: Package + Hash flightsim.to bundle
        shell: pwsh
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          $zip = "gsx-integrator-flightsim-to-$env:VER.zip"
          Compress-Archive -Path 'staging-flightsim-to/gsx-integrator-client' -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            gsx-integrator-client-*.zip
            gsx-integrator-client-*.zip.sha256
            gsx-integrator-flightsim-to-*.zip
            gsx-integrator-flightsim-to-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: [ version, build ]
    if: needs.version.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle

      - name: Publish release
        uses: brunofgmag/gsx-integrator-ci/.github/actions/publish-release@main
        with:
          tag: ${{ needs.version.outputs.tag }}
          version: ${{ needs.version.outputs.version }}
          target: ${{ github.sha }}
          assets: |
            gsx-integrator-client-${{ needs.version.outputs.version }}.zip
            gsx-integrator-client-${{ needs.version.outputs.version }}.zip.sha256
            gsx-integrator-flightsim-to-${{ needs.version.outputs.version }}.zip
            gsx-integrator-flightsim-to-${{ needs.version.outputs.version }}.zip.sha256
